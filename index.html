<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>隨手記帳</title>
<meta name="theme-color" content="#2a78d6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div id="marqueeBar"><div id="marqueeTrack"></div></div>
  <header class="topbar">
    <h1 id="topbar-title">隨手記帳</h1>
    <button id="topbar-action" class="topbar-action" style="display:none"></button>
  </header>

  <main id="main"></main>

  <nav class="bottom-nav">
    <a href="#/list" data-route="list"><span class="icon">📋</span>列表</a>
    <a href="#/entry" data-route="entry"><span class="icon">➕</span>新增</a>
    <a href="#/reports" data-route="reports"><span class="icon">📊</span>報表</a>
    <a href="#/settings" data-route="settings"><span class="icon">⚙️</span>設定</a>
  </nav>
</div>

<div id="scan-overlay" class="scan-overlay" style="display:none">
  <button class="scan-close" id="scan-close">✕</button>
  <div class="scan-hint" id="scan-hint">將電子發票 QR Code 對準框內</div>
  <video id="scan-video" playsinline muted></video>
  <div class="scan-frame"></div>
  <div id="scan-status" class="scan-status" style="display:none">
    <p id="scan-status-text"></p>
    <div class="scan-status-actions">
      <button id="scan-retry" type="button">重試</button>
      <button id="scan-manual" type="button">改用手動輸入</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>

<script src="lib/jsqr.min.js"></script>
<script src="js/db.js"></script>
<script src="js/invoice-parser.js"></script>
<script src="js/scanner.js"></script>
<script src="js/charts.js"></script>
<script src="js/backup.js"></script>
<script src="js/app.js"></script>
<script>
/* 頂部跑馬燈 — 獨立運作，跟上面記帳邏輯無關；內容抓自工作區共用的授權伺服器
   （doPost 不論序號是否有效都會附上 marquee 陣列，這個 App 沒有序號登入機制，
   所以直接帶空序號打，只取 marquee 欄位）。跟其他共用同一份跑馬燈 Google Sheet
   的工具改內容互通，不需要分開維護。 */
(function () {
  'use strict';
  var MARQUEE_CHECK_URL = "https://script.google.com/macros/s/AKfycbwKX0DNNbY8y4nf90BFTHtxgfqJcHHcZasRrgycl4QAe52_hkjMWSkYk4xOsqU-JPCROw/exec";
  var STORAGE_KEY = 'etpMarquee';
  var REFRESH_MS = 20 * 60 * 1000;

  var bar = document.getElementById('marqueeBar');
  var track = document.getElementById('marqueeTrack');
  var lastKey = null;

  function loadCache() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (e) { return []; }
  }
  function saveCache(items) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch (e) {}
  }
  // 把「[文字](https://...)」語法轉成可點擊連結，其餘文字維持純文字（用 createTextNode 避免 XSS）
  function appendParsedText(container, text) {
    var re = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
    var lastIndex = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > lastIndex) container.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
      var a = document.createElement('a');
      a.href = m[2];
      a.textContent = m[1];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.style.color = 'inherit';
      a.style.textDecoration = 'underline';
      container.appendChild(a);
      lastIndex = re.lastIndex;
    }
    if (lastIndex < text.length) container.appendChild(document.createTextNode(text.slice(lastIndex)));
  }
  function buildTrackContent(items) {
    var frag = document.createDocumentFragment();
    function appendPass() {
      items.forEach(function (item, idx) {
        if (idx > 0) frag.appendChild(document.createTextNode('　★　'));
        appendParsedText(frag, item);
      });
    }
    appendPass();
    frag.appendChild(document.createTextNode('　★　'));
    appendPass();
    return frag;
  }
  function render(items) {
    if (!items || !items.length) return;
    var key = JSON.stringify(items);
    if (key === lastKey) return;   // 內容沒變就不重繪，避免 CSS animation 被重置而歸零重跑
    lastKey = key;
    track.innerHTML = '';
    track.appendChild(buildTrackContent(items));
    bar.classList.add('show');
    var width = track.scrollWidth / 2;
    track.style.animationDuration = Math.max(width / 80, 10) + 's';
  }
  function fetchMarquee() {
    fetch(MARQUEE_CHECK_URL, { method: 'POST', body: JSON.stringify({ serial: '' }) })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && Array.isArray(data.marquee) && data.marquee.length) {
          saveCache(data.marquee);
          render(data.marquee);
        }
      })
      .catch(function () {});
  }

  render(loadCache());
  fetchMarquee();
  setInterval(fetchMarquee, REFRESH_MS);
})();
</script>
</body>
</html>
