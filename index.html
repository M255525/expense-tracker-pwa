<script>
/* 頂部跑馬燈 — 獨立運作，跟上面記帳邏輯無關；內容抓自工作區共用的授權伺服器
   （doPost 不論序號是否有效都會附上 marquee 陣列，這個 App 沒有序號登入機制，
   所以直接帶空序號打，只取 marquee 欄位）。跟其他共用同一份跑馬燈 Google Sheet
   的工具改內容互通，不需要分開維護。 */
(function () {
  'use strict';
  var MARQUEE_CHECK_URL = "https://script.google.com/macros/s/AKfycbwKX0DNNbY8y4nf90BFTHtxgfqJcHHcZasRrgycl4QAe52_hkjMWSkYk4xOsqU-JPCROw/exec";
  var STORAGE_KEY = 'etpMarquee';
  var REFRESH_MS = 20 * 60 * 1000;

  var bar = document.getElementById('marqueeBar');
  var track = document.getElementById('marqueeTrack');
  var lastKey = null;

  function loadCache() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch (e) { return []; }
  }
  function saveCache(items) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch (e) {}
  }
  // 把「[文字](https://...)」語法轉成可點擊連結，其餘文字維持純文字（用 createTextNode 避免 XSS）
  function appendParsedText(container, text) {
    var re = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g;
    var lastIndex = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > lastIndex) container.appendChild(document.createTextNode(text.slice(lastIndex, m.index)));
      var a = document.createElement('a');
      a.href = m[2];
      a.textContent = m[1];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.style.color = 'inherit';
      a.style.textDecoration = 'underline';
      container.appendChild(a);
      lastIndex = re.lastIndex;
    }
    if (lastIndex < text.length) container.appendChild(document.createTextNode(text.slice(lastIndex)));
  }
  function buildTrackContent(items) {
    var frag = document.createDocumentFragment();
    function appendPass() {
      items.forEach(function (item, idx) {
        if (idx > 0) frag.appendChild(document.createTextNode('　★　'));
        appendParsedText(frag, item);
      });
    }
    appendPass();
    frag.appendChild(document.createTextNode('　★　'));
    appendPass();
    return frag;
  }
  function render(items) {
    if (!items || !items.length) return;
    var key = JSON.stringify(items);
    if (key === lastKey) return;   // 內容沒變就不重繪，避免 CSS animation 被重置而歸零重跑
    lastKey = key;
    track.innerHTML = '';
    track.appendChild(buildTrackContent(items));
    bar.classList.add('show');
    var width = track.scrollWidth / 2;
    track.style.animationDuration = Math.max(width / 80, 10) + 's';
  }
  function fetchMarquee() {
    fetch(MARQUEE_CHECK_URL, { method: 'POST', body: JSON.stringify({ serial: '' }) })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data && Array.isArray(data.marquee) && data.marquee.length) {
          saveCache(data.marquee);
          render(data.marquee);
        }
      })
      .catch(function () {});
  }

  render(loadCache());
  fetchMarquee();
  setInterval(fetchMarquee, REFRESH_MS);
})();
</script>

<!-- 使用警語（2026-11-20 補齊標準配備）：頁面上的入口加在訪客計數器旁，首次造訪自動跳出一次 -->
<style>
.mkw-mask{position:fixed;inset:0;background:rgba(15,18,22,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:2147483000}
.mkw-box{background:#fff;color:#222;max-width:520px;width:100%;max-height:calc(100vh - 32px);overflow:auto;border-radius:12px;padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.3);font:15px/1.7 "Microsoft JhengHei","PingFang TC",system-ui,sans-serif;text-align:left}
.mkw-box h2{margin:0 0 8px;font-size:1.15rem;color:#b3261e}
.mkw-box ul{margin:0 0 14px;padding-left:1.2em}
.mkw-box li{margin:4px 0}
.mkw-box button{font:inherit;background:#b3261e;color:#fff;border:0;border-radius:8px;padding:8px 18px;cursor:pointer}
.mkw-link{color:inherit;cursor:pointer;text-decoration:underline}
.mkw-pill{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:2147482000;background:rgba(255,255,255,.92);color:#b3261e;border:1px solid #b3261e;border-radius:999px;padding:3px 10px;font:13px/1.4 "Microsoft JhengHei",system-ui,sans-serif;cursor:pointer}
@media (prefers-color-scheme:dark){.mkw-box{background:#24272b;color:#eee}.mkw-box h2{color:#ff8a80}}
</style>
<script>
(function(){
  var C = {"key":"mkw.expense-tracker-pwa.seen","items":["記帳資料只存在這支手機的瀏覽器裡，沒有雲端備份；清除瀏覽器資料或換手機前，請先到設定匯出備份。","掃描發票會使用攝影機，影像只在手機上辨識 QR Code，不會上傳。","統計數字只供個人參考，報稅或對帳請以發票與帳戶紀錄為準。","本工具由個人開發、免費提供，僅供學習與參考；使用結果請自行判斷，作者不負任何責任。"],"noPill":true};
  function open(){
    if(document.querySelector('.mkw-mask')) return;
    var m = document.createElement('div'); m.className = 'mkw-mask'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-label', '使用警語');
    var b = document.createElement('div'); b.className = 'mkw-box';
    var h = document.createElement('h2'); h.textContent = '⚠ 使用警語'; b.appendChild(h);
    var ul = document.createElement('ul'); C.items.forEach(function(t){ var li = document.createElement('li'); li.textContent = t; ul.appendChild(li); }); b.appendChild(ul);
    var ok = document.createElement('button'); ok.type = 'button'; ok.textContent = '我知道了'; b.appendChild(ok);
    function close(){ m.remove(); document.removeEventListener('keydown', esc, true); try{ localStorage.setItem(C.key, '1'); }catch(e){} }
    function esc(e){ if(e.key === 'Escape'){ e.stopPropagation(); close(); } }
    ok.addEventListener('click', close); m.addEventListener('click', function(e){ if(e.target === m) close(); });
    document.addEventListener('keydown', esc, true);
    m.appendChild(b); document.body.appendChild(m); ok.focus();
  }
  function link(){ var a = document.createElement('a'); a.href = '#'; a.className = 'mkw-link'; a.textContent = '⚠ 使用警語'; a.addEventListener('click', function(e){ e.preventDefault(); open(); }); return a; }
  // 入口放在訪客計數器旁邊（計數器是 JS 晚產生的也會補上）
  function attach(){
    var imgs = document.querySelectorAll('img[src*="visitor-badge"], img[src*="hits.sh"], img[src*="countapi"]'), n = 0;
    Array.prototype.forEach.call(imgs, function(img){
      var host = img.closest('a') || img;
      if(host.previousSibling && host.previousSibling.className === 'mkw-sep') { n++; return; }
      var s = document.createElement('span'); s.className = 'mkw-sep'; s.appendChild(link()); s.appendChild(document.createTextNode('　'));
      host.parentNode.insertBefore(s, host); n++;
    });
    return n;
  }
  function init(){
    var found = attach();
    if(!found && !C.noPill){ var p = document.createElement('button'); p.type = 'button'; p.className = 'mkw-pill'; p.textContent = '⚠ 使用警語'; p.addEventListener('click', open); document.body.appendChild(p); }
    var tm = null; if(window.MutationObserver) new MutationObserver(function(){ if(tm) return; tm = setTimeout(function(){ tm = null; attach(); }, 400); }).observe(document.body, {childList: true, subtree: true});
    var seen = false; try{ seen = localStorage.getItem(C.key) === '1'; }catch(e){ seen = true; }
    if(!seen) setTimeout(open, 600);
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
